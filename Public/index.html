<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Monolito MVC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- VISTA DE LOGIN -->
    <div id="loginView" class="login-view">
        <div class="login-card">
            <h1>Administración</h1>
            <p class="login-subtitle">Ingresa tus datos para continuar</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginNombre">Nombre de Usuario</label>
                    <input type="text" id="loginNombre" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Contraseña</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label for="loginClave">Clave de Empresa</label>
                    <input type="text" id="loginClave" required>
                </div>
                <button type="submit" id="loginButton" class="btn btn-primary btn-full">Ingresar</button>
            </form>
            <div id="loginMessage" class="message"></div>
        </div>
    </div>

    <!-- VISTA PRINCIPAL DE LA APLICACIÓN -->
    <div id="appView" class="app-view hidden">
        <!-- TOPBAR -->
        <header class="topbar">
            <div class="topbar-company">
                <span class="company-label">Empresa en Sesión</span>
                <span id="companyName">---</span>
            </div>
            <div class="topbar-right">
                <span id="userRole" class="user-role">---</span>
                <button id="logoutButton" class="btn btn-logout">Cerrar sesión</button>
            </div>
        </header>

        <div class="main-layout">
            <!-- SIDEBAR -->
            <aside class="sidebar">
                <div class="sidebar-user">
                    <div id="userInitial" class="user-avatar">-</div>
                    <div class="user-information">
                        <span class="user-label">Usuario</span>
                        <span id="sidebarUserName">---</span>
                    </div>
                </div>
                <nav class="sidebar-navigation">
                    <button class="nav-item" data-module="empresas">
                        <span class="nav-icon">🏢</span><span>Empresas</span>
                    </button>
                    <button class="nav-item" data-module="usuarios">
                        <span class="nav-icon">👥</span><span>Usuarios</span>
                    </button>
                    <button class="nav-item" data-module="unidadMedidas">
                        <span class="nav-icon">📏</span><span>Unidades de Medida</span>
                    </button>
                    <button class="nav-item" data-module="tipodocumento">
                        <span class="nav-icon">🗂️</span><span>Tipos de Documento</span>
                    </button>
                    <button class="nav-item" data-module="categorias">
                        <span class="nav-icon">📂</span><span>Categorías</span>
                    </button>
                    <button class="nav-item" data-module="terceros">
                        <span class="nav-icon">🤝</span><span>Terceros</span>
                    </button>
                </nav>
            </aside>

            <!-- CONTENIDO DINÁMICO -->
            <main class="content">
                <!-- VISTA DE BIENVENIDA -->
                <div id="welcomeView" class="welcome-view">
                    <div class="welcome-icon">🏠</div>
                    <h1>Bienvenido al Sistema</h1>
                    <p>Selecciona una opción del menú lateral para comenzar a gestionar los datos.</p>
                </div>

                <!-- CONTENEDOR DEL MÓDULO ACTIVO -->
                <div id="moduleView" class="module-view hidden">
                    <div class="module-header">
                        <div>
                            <h1 id="moduleTitle">---</h1>
                            <p id="moduleDescription">---</p>
                        </div>
                        <button id="addButton" class="btn btn-primary">+ Agregar Nuevo</button>
                    </div>

                    <!-- BARRA DE FILTROS -->
                    <div class="filters-card">
                        <div class="filter-group filter-search">
                            <label for="filterText">Buscar término</label>
                            <input type="text" id="filterText" placeholder="Escribe para filtrar...">
                        </div>
                        <div class="filter-group">
                            <label for="pageSize">Registros</label>
                            <select id="pageSize">
                                <option value="50">50 por pág.</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="orderField">Ordenar por</label>
                            <select id="orderField">
                                <option value="1">Campo Principal (1)</option>
                                <option value="2">Campo Secundario (2)</option>
                                <option value="3">Fecha Creación / Doc (3)</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="orderDirection">Dirección</label>
                            <select id="orderDirection">
                                <option value="ASC">Ascendente</option>
                                <option value="DESC">Descendente</option>
                            </select>
                        </div>
                        <div class="filter-actions">
                            <button id="searchButton" class="btn btn-primary">Consultar</button>
                        </div>
                    </div>

                    <div id="moduleMessage" class="message"></div>

                    <!-- TABLA DE DATOS -->
                    <div class="table-container">
                        <table>
                            <thead id="dataTableHead"></thead>
                            <tbody id="dataTableBody"></tbody>
                        </table>
                        <div id="emptyTable" class="empty-table hidden">
                            No hay registros para mostrar.
                        </div>
                    </div>

                    <!-- PAGINACIÓN -->
                    <div class="pagination">
                        <button id="previousPage" class="btn btn-secondary">← Anterior</button>
                        <span id="pageInformation">Página 1</span>
                        <button id="nextPage" class="btn btn-secondary">Siguiente →</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- MODAL DINÁMICO PARA FORMULARIOS (CREAR / EDITAR) -->
    <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Nuevo Registro</h2>
                <button type="button" id="modalClose" class="modal-close">&times;</button>
            </div>
            <form id="recordForm">
                <div id="modalFields" class="modal-fields">
                    <!-- Los inputs se inyectarán de forma dinámica mediante JavaScript -->
                </div>
                <div class="modal-actions">
                    <button type="button" id="modalCancel" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" id="modalSave" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
